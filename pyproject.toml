[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-ai-platform"
version = "0.1.0"
description = "German clinical ingestion with exact evidence provenance (not a medical device)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
clinical = ["spacy>=3.7,<4", "medspacy>=1.3,<2", "bioc>=2.1,<3"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
"backend.app.layer1_ingestion" = ["rules/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
