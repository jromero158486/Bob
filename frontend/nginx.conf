server {
  listen 80;
  root /usr/share/nginx/html;
  # Docker DNS, re-resolved: a recreated backend container gets a new IP (stale IP caused 502s).
  resolver 127.0.0.11 valid=10s ipv6=off;
  location /api/ { set $backend http://backend:8000; proxy_pass $backend; proxy_read_timeout 120s; }
  location / { try_files $uri /index.html; }
}
